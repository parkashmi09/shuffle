<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0C0D1D" />
    <meta
      name="description"
      content="Shuffle operator admin console"
    />

    <!--
      ═══════════════════════════════════════════════════════════════════════
      CONTENT SECURITY POLICY

      The staff token lives in localStorage, which means any script that runs
      on this origin can read it and hold an operator session with
      `wallet:credit` and `withdrawals:approve` behind it. Moving the token to
      an HttpOnly cookie would remove that reach; a CSP removes the injected
      script in the first place, which is the more useful half — and unlike
      the cookie change it does not require rewriting how every screen
      authenticates.

      Notes on the specific directives:

      · `script-src 'self'` with NO `'unsafe-inline'`. This is why the build
        script sets INLINE_RUNTIME_CHUNK=false — CRA otherwise inlines the
        webpack runtime into a <script> tag here, and admitting inline script
        to allow it would defeat the directive entirely.

      · `style-src` DOES allow 'unsafe-inline'. MUI's emotion engine injects
        every component style as an inline <style> element at runtime, so the
        panel renders unstyled without it. An injected stylesheet is a real but
        much narrower problem than injected script, and the alternative — a
        nonce threaded through emotion's cache — is not something a meta-tag
        CSP can express.

      · `connect-src` must list the gateway and the admin socket server. They
        are separate origins from this one, and sockets do NOT go through the
        gateway (it is an HTTP reverse proxy with no upgrade handling), which
        is why :4002 appears alongside :4000. UPDATE BOTH when deploying.

      · `frame-ancestors 'none'` is clickjacking cover — an operator console
        should never be embeddable. `object-src 'none'` and `base-uri 'self'`
        close the two classic ways an injection turns into script execution
        without a <script> tag.

      A meta-tag CSP is what a static build can carry on its own. Serve this
      as a real `Content-Security-Policy` RESPONSE HEADER where you can:
      `frame-ancestors` is ignored in a meta tag, so pair it with
      `X-Frame-Options: DENY` until then.
      ═══════════════════════════════════════════════════════════════════════
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src 'self' https://fonts.gstatic.com data:;
               img-src 'self' data: blob:;
               connect-src 'self' http://127.0.0.1:4000 http://localhost:4000 http://127.0.0.1:4002 http://localhost:4002 ws://127.0.0.1:4002 ws://localhost:4002;
               object-src 'none';
               base-uri 'self';
               form-action 'self';
               frame-ancestors 'none'"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- Never leak an operator's console path to a third-party site. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/logo.svg" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Shuffle Admin</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
